    <path d="M386 88l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <circle cx="374" cy="260" r="4"/><circle cx="112" cy="270" r="3"/>
  </g>
  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
