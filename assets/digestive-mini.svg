<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Minh họa biểu tượng hệ tiêu hóa</title>
  <desc id="desc">Minh họa giáo dục dạng vector, sử dụng hình khối mềm và màu pastel để gợi tả các cơ quan chính của hệ tiêu hóa.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f2e3bc"/></linearGradient>
    <linearGradient id="stomach" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2b2a4"/><stop offset="1" stop-color="#d77e76"/></linearGradient>
    <linearGradient id="liver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8a65b"/><stop offset="1" stop-color="#b98235"/></linearGradient>
    <linearGradient id="gut" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7d8a0"/><stop offset="1" stop-color="#e9b85f"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#95702d" flood-opacity=".13"/></filter>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#paper)"/>
  <circle cx="240" cy="177" r="126" fill="#fffdf7" opacity=".8"/>
  <circle cx="240" cy="177" r="103" fill="none" stroke="#dfc98e" stroke-width="1.5" stroke-dasharray="3 8"/>
  <g fill="#d5ae58">
