name: Deploy BioSphere Slides to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biosphere-netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish production site
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: "7f34affb-07fd-4822-84f6-b8ef9b73aae3"
    steps:
      - name: Explain one-time setup if credentials are missing
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' }}
        run: |
          echo "::notice title=Netlify deploy not configured::Add repository Actions secret NETLIFY_AUTH_TOKEN, then run this workflow again."
          echo "The production deploy is safely skipped until the secret is configured."

      - name: Check out repository
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare only publishable tracked files
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/netlify-publish"
          mkdir -p "$dest"
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|.gitignore|.gitattributes|.editorconfig|.netlify/*)
                continue
                ;;
            esac
            mkdir -p "$dest/$(dirname "$file")"
            cp "$file" "$dest/$file"
          done < <(git ls-files -z)
          test -f "$dest/index.html"
          echo "Prepared tracked website files for deployment."

      - name: Install Netlify CLI
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        run: npm install --global netlify-cli

      - name: Deploy to Netlify production
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          netlify deploy \
            --debug \
            --no-build \
            --prod \
            --dir "$RUNNER_TEMP/netlify-publish" \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "GitHub Actions production deploy ${GITHUB_SHA}"
